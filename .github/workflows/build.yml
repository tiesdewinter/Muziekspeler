name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Toon bestanden
        run: find . -not -path './.git/*' -type f | head -50
      - name: Bouw APK
        run: |
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          echo "Project gevonden in: $S"
          cd "$(dirname "$S")"
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MuziekSlot-apk
          path: "**/app-debug.apk"
